# The contributor licence agreement check. tools/public_export.py copies this file to the public copy as
# .github/workflows/cla.yml (the private repository's own .github/ never goes public).
#
# A pull request's author signs CLA.md once by replying with the sentence below. Signatures are kept as JSON on the
# public repository's `cla-signatures` branch, which nothing else writes to: the export replaces `main` on every
# release and would wipe a signatures file kept there. The action is pinned to the commit of release v2.6.1.
# If CLA.md changes in substance, point path-to-signatures at a new file (cla-v2.json) so everybody signs again.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the contributor licence agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/LunarWerxs/rAidiology/blob/main/CLA.md
          branch: cla-signatures
          allowlist: LunarWerxs,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thank you for this pull request. Before it can be merged, please read the
            [contributor licence agreement](https://github.com/LunarWerxs/rAidiology/blob/main/CLA.md).
            If you agree to it, reply to this pull request with the sentence below, exactly as written.
            You sign once; later pull requests are covered.
          custom-allsigned-prcomment: Every author of this pull request has signed the contributor licence agreement.
          lock-pullrequest-aftermerge: false
